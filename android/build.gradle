buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { project ->
    def configureProject = {
        if (project.hasProperty('android')) {
            project.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DCMAKE_OBJECT_PATH_MAX=150"
                        }
                    }
                }
                // Redirect C++ builds to a shorter folder to avoid Windows path limit issues
                try {
                    project.android.externalNativeBuild.cmake.buildStagingDirectory = new File(rootProject.projectDir, "../.cxx/${project.name}")
                } catch (Exception e) {
                    // Safe fallthrough
                }
            }
        }
    }
    if (project.state.executed) {
        configureProject()
    } else {
        project.afterEvaluate {
            configureProject()
        }
    }
}

